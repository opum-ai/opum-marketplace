name: promotion guards

# OMARK-29, replicating opum-agent's own shape (OPAG-64 wave 2) and opum-doc's
# ODOC-73/ODOC-155 (see opum-doc docs/runbooks/promote-dev-to-main.md,
# Guardrails). Kept in its own workflow so ci.yml's trigger set (dev on push
# and PR, main on push and PR) stays as designed: these two jobs need PRs INTO
# main and pushes TO main specifically, and ODOC-155 found that folding them
# into a general CI workflow behind an `if:` condition is a latent defect --
# the push-side guard silently never fired through several real promotions
# because ci.yml's `if:` never evaluated true for the way the push actually
# happened. A dedicated trigger set is what makes the push-side job fire for
# real, independent of whatever the main CI workflow's own trigger looks like.
#
# Neither job is a required status check, and that is deliberate. GitHub gates
# a direct push by the pushed SHA's own prior check history, and a job that
# only runs for PRs into main or pushes to main never reports for dev's tip in
# any other context, so wiring either into main's required checks would make
# the one correct promotion path, git push origin dev:main, permanently
# unpushable. opum-doc verified that against a scratch ruleset before ruling
# it out; do the same before ever trying to require either of these for real.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  promotion-is-manual:
    # Always fails on a PR into main, on purpose: the merge button is the wrong
    # action here (it staples a commit onto main that dev never had), and a red
    # X on exactly that button is the detection. The orchestrator's promotion
    # gate reads REQUIRED checks on the SHA, so this job's failure does not
    # block the fast-forward push it exists to steer people toward.
    name: dev-to-main promotion is a manual fast-forward push
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: do not merge this PR with the button
        run: |
          echo "::error::Do not merge this PR with the GitHub merge button; it would create a commit main never had on dev and break the fast-forward promotion model (opum-doc docs/runbooks/promote-dev-to-main.md). This check fails on purpose and is not required. Once the required checks are green on this exact SHA, land it with: git push origin dev:main"
          exit 1

  main-is-fast-forward-of-dev:
    # Defense in depth: any commit that reached main by git push origin
    # origin/dev:main is one dev already held; a button merge creates a SHA dev
    # never had.
    #
    # OMARK-58. The assertion used to be written inline here and checked ONE
    # property - that main's new HEAD is contained in dev - while the job was
    # named for fast-forwardness, which is strictly stronger. It printed
    # "genuine fast-forward" on a force-push REWIND, because it never read where
    # main had been. Inline, it could have no tests by construction, and it only
    # ran on a real push to main, so every green run meant only that the other
    # jobs passed. The same shape was in eight repositories and five sessions
    # found five independent defects in it in one evening.
    #
    # It is now a script with a proof suite that runs on every PR (see ci.yml),
    # asserting three separate properties with three separate messages:
    #   1. main moved FORWARD          - github.event.before is an ancestor of HEAD
    #   2. main's HEAD CAME FROM dev   - HEAD is contained in origin/dev
    #   3. main IS dev, not part of it - nothing left behind (warning only)
    # Kept separate on purpose: adding 1 as a REPLACEMENT for 2 would have
    # traded a known blind spot for a new one while looking like a fix.
    name: main landed via fast-forward from dev
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing twice over: the shallow default has
      # neither main's previous HEAD nor enough history for either ancestor
      # test. If it is ever dropped, the script says so in those words rather
      # than reporting a damaged branch - but nothing here MEASURES that it is
      # present, which is why the wiring is only proven by a real promotion.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: main must have moved forward, from dev, and completely
        env:
          BEFORE_SHA: ${{ github.event.before }}
          FORCED: ${{ github.event.forced }}
        run: ./scripts/ci/assert-main-fast-forward.sh
