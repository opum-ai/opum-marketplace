name: ci

# Deliberately NOT `on: [push, pull_request]`. That fires both events for a
# branch pushed to this repo and opened as a PR, running every job twice on the
# same SHA - which is the exact bug the task-before-branch eval case is built
# around. Push is scoped to the long-lived branches only.
on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      run_eval:
        description: Run the paid plugin eval suite
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Free, deterministic, and runs on everything. Enforces the eval suite's
  # structural invariants without a model or an API key.
  structure:
    name: check · eval structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-evals.mjs

  # Validates every plugin and marketplace manifest parses and matches itself.
  manifest:
    name: check · manifests
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0, deliberately. The default shallow checkout has no merge
      # base with the base branch, so the diff below exits 128 instead of
      # answering - see the comment on that step.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Manifests are valid JSON and agree on the plugin name
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const plugin = JSON.parse(fs.readFileSync(".claude-plugin/plugin.json", "utf8"));
            const market = JSON.parse(fs.readFileSync(".claude-plugin/marketplace.json", "utf8"));
            const named = market.plugins.map((p) => p.name);
            if (!named.includes(plugin.name)) {
              throw new Error(`marketplace.json does not list ${plugin.name}; it lists ${named.join(", ")}`);
            }
            // A source is either a local path (this repository owns the plugin) or,
            // for a federated entry, an object naming another repository. The
            // path form must exist here. The object form cannot be checked for
            // existence without the network, so check its shape instead - and
            // require a pin, because the fleet decided (OPAG-37) that a federated
            // skill is cut from the same release tag as the CLI it describes; an
            // unpinned entry would track the default branch and drift from it.
            for (const p of market.plugins) {
              const s = p.source;
              if (typeof s === "string") {
                if (!fs.existsSync(s)) throw new Error(`${p.name} source ${s} does not exist`);
                continue;
              }
              if (!s || typeof s !== "object") throw new Error(`${p.name} source is neither a path nor an object`);
              if (!["github", "git-subdir"].includes(s.source)) throw new Error(`${p.name} source kind ${s.source} is not github or git-subdir`);
              if (s.source === "github" && !/^[\w.-]+\/[\w.-]+$/.test(s.repo || "")) throw new Error(`${p.name} github source needs repo as owner/name, got ${s.repo}`);
              if (s.source === "git-subdir" && !(s.url && s.path)) throw new Error(`${p.name} git-subdir source needs url and path`);
              if (!(s.ref || s.sha)) throw new Error(`${p.name} federated source must pin ref or sha; unpinned entries track the default branch and drift from the CLI they describe`);
            }
            console.log(`manifests OK (${named.length} plugin(s): ${named.join(", ")})`);
          '

      # Free, deterministic, no network: proves the checker two steps down
      # actually fails on the v0.4.3-shaped defect (ref names one version,
      # plugin.json declares another), against a local fixture server. Runs
      # unconditionally so a regression in the checker itself is caught even
      # on a push that never touches marketplace.json.
      - name: Federated pin checker has a passing regression test
        run: node scripts/test/check-federated-pins.test.mjs

      # A plugin's version in its manifest is how the harness resolves updates.
      # Ship content without bumping it and `claude plugin update` answers
      # "already at the latest version" - consumers keep the old copy forever and
      # nothing anywhere reports a problem. That happened once: the session hooks
      # landed at 0.1.0 and were invisible to every installed plugin until the
      # version moved.
      - name: Plugin content changed means the version moved
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${{ github.base_ref }}"

          # Resolve the merge base explicitly rather than relying on `A...B`.
          #
          # This step used to shallow-fetch with --depth=1 and ask `git diff
          # --quiet "$base...HEAD"`. Two shallow histories have NO merge base, so
          # that diff exited 128 rather than answering - and `if ! git diff` reads
          # any nonzero status as "there is a diff". The check therefore reported
          # "plugin content changed" on every pull request, and passed only when
          # the version happened to have moved anyway. It had the shape of a gate
          # while measuring nothing, which is worse than not having it: the one
          # PR it should have caught would have looked exactly like the ones it
          # waved through.
          #
          # Failing to find a merge base is now fatal and says so, instead of
          # being silently indistinguishable from a real change.
          if ! merge_base=$(git merge-base "$base" HEAD); then
            echo "::error::no merge base between $base and HEAD - cannot tell what this PR changed."
            exit 1
          fi

          # .claude-plugin/plugin.json, not the whole directory: marketplace.json is the
          # index of every plugin, and a federated entry added there is not a change
          # to opum-workflow's content, so it must not demand opum-workflow's version
          # move - a bump with no content change tells every consumer to update for
          # nothing.
          changed=$(git diff --name-only "$merge_base" HEAD -- skills/ hooks/ agents/ commands/ .claude-plugin/plugin.json)
          if [ -n "$changed" ]; then
            before=$(git show "$base:.claude-plugin/plugin.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')
            after=$(node -e 'console.log(require("./.claude-plugin/plugin.json").version)')
            if [ "$before" = "$after" ]; then
              echo "::error::plugin content changed but version is still $before."
              echo "Files changed:"
              printf '%s\n' "$changed" | sed 's/^/  - /'
              echo "Bump .claude-plugin/plugin.json - the manifest version is how the harness resolves updates."
              exit 1
            fi
            echo "plugin content changed, version $before -> $after: OK"
          else
            echo "no plugin content changed; version bump not required"
          fi

      # A federated entry pins a tag so its skill can never drift from the CLI
      # it describes (OPAG-37) - but a pin only does that if the tagged
      # release actually carries the content the pin implies. lore-cli's
      # v0.4.3 tag bumped its own package.json but not
      # .claude-plugin/plugin.json, so opum-marketplace pinned a tag whose
      # plugin manifest still read the PREVIOUS version - `claude plugin
      # update` saw no version change and silently kept serving the old
      # skill. Nothing caught it; it was found by hand, twice (OMARK-2,
      # OMARK-6). scripts/check-federated-pins.mjs is a self-consistency
      # check, not a diff against the previous pin: a pinned ref's own
      # plugin.json must declare that same version.
      #
      # Gated on marketplace.json changing in this PR - the pinned tags don't
      # change on their own, so a PR that doesn't touch the index can't have
      # introduced a bad one, and skipping the network read keeps an
      # unrelated PR (a hooks fix, say) from failing on a transient GitHub
      # API problem in a repository it never touched.
      - name: Federated entry pins match their own plugin version
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${{ github.base_ref }}"
          if ! merge_base=$(git merge-base "$base" HEAD); then
            echo "::error::no merge base between $base and HEAD - cannot tell what this PR changed."
            exit 1
          fi
          changed=$(git diff --name-only "$merge_base" HEAD -- .claude-plugin/marketplace.json)
          if [ -z "$changed" ]; then
            echo "marketplace.json unchanged; skipping the federated pin check (no network read)."
            exit 0
          fi
          node scripts/check-federated-pins.mjs

  # The PLAN.md 5.3 ship gate. MANUAL DISPATCH ONLY - it is deliberately not
  # wired to pull_request.
  #
  # In CI this job authenticates with ANTHROPIC_API_KEY, which is metered per
  # token: one full suite is ~$4.75 of real API spend. Run automatically on every
  # PR touching evals/ or skills/, that is a recurring charge for an answer that
  # changes rarely. Run the suite locally instead, where it uses the machine's
  # existing Claude Code auth, and record the result in the PR body:
  #
  #   node scripts/check-evals.mjs        # free, always
  #   ./scripts/run-eval.sh               # the paid gate, on demand
  #
  # This job exists for the cases where local is not enough: confirming the suite
  # passes on a clean checkout, or re-running the gate without a workstation.
  #
  # --scaffold runs each case's scaffold_script. Those scripts execute on this
  # runner, so evals/*/setup.sh are review-sensitive files: treat a PR touching
  # one the way you would treat a PR touching the workflow itself.
  #
  # The command is NOT piped. A shell pipeline reports its LAST stage's exit
  # status, so piping through tee or tail would turn a failing suite into a
  # green check.
  eval:
    name: check · plugin eval
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_eval
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run the eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # plugin eval is early access and gated on this flag.
          CLAUDE_CODE_WALNUT_SPIRE: '1'
        run: |
          claude plugin eval . \
            --ablation with-without \
            --judge-model sonnet \
            --scaffold \
            --no-publish \
            --threshold 1 \
            --max-cost-usd 15 \
            --json eval-result.json

      - name: Upload the eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-eval-report
          path: |
            eval-result.json
            evals/results/
          if-no-files-found: warn
