name: ci

# Deliberately NOT `on: [push, pull_request]`. That fires both events for a
# branch pushed to this repo and opened as a PR, running every job twice on the
# same SHA - which is the exact bug the task-before-branch eval case is built
# around. Push is scoped to the long-lived branches only.
on:
  pull_request:
  push:
    branches: [dev, main]
  # A pinned tag can be deleted and recreated over different content without
  # this repository changing at all (OMARK-43/OMARK-44), so a PR-only trigger
  # cannot see a repoint. The daily run is the only thing that can. Scheduled
  # runs execute on the default branch, dev.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Validates every plugin and marketplace manifest parses and matches itself.
  manifest:
    name: check · manifests
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0, deliberately. The default shallow checkout has no merge
      # base with the base branch, so the diff below exits 128 instead of
      # answering - see the comment on that step.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Manifests are valid JSON and each entry is well-formed
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const market = JSON.parse(fs.readFileSync(".claude-plugin/marketplace.json", "utf8"));
            const named = market.plugins.map((p) => p.name);
            // Every entry here is federated (OMARK-38: opum-workflow, the one
            // plugin this repository ever owned directly, moved to opum-fleet).
            // A source is an object naming another repository - the path form
            // ("this repository owns the plugin") no longer applies to anything
            // listed here, so an entry using it is itself the defect. The object
            // form cannot be checked for existence without the network, so check
            // its shape instead - and require a pin, because the fleet decided
            // (OPAG-37) that a federated skill is cut from the same release tag
            // as the CLI it describes; an unpinned entry would track the default
            // branch and drift from it.
            for (const p of market.plugins) {
              const s = p.source;
              if (typeof s === "string") throw new Error(`${p.name} uses a local path source ("${s}") - every entry here must be federated, this repository owns no plugin directly`);
              if (!s || typeof s !== "object") throw new Error(`${p.name} source is not an object`);
              if (!["github", "git-subdir"].includes(s.source)) throw new Error(`${p.name} source kind ${s.source} is not github or git-subdir`);
              if (s.source === "github" && !/^[\w.-]+\/[\w.-]+$/.test(s.repo || "")) throw new Error(`${p.name} github source needs repo as owner/name, got ${s.repo}`);
              if (s.source === "git-subdir" && !(s.url && s.path)) throw new Error(`${p.name} git-subdir source needs url and path`);
              if (!(s.ref || s.sha)) throw new Error(`${p.name} federated source must pin ref or sha; unpinned entries track the default branch and drift from the CLI they describe`);
            }
            console.log(`manifests OK (${named.length} plugin(s): ${named.join(", ")})`);
          '

      # Free, deterministic, no network: proves the checker two steps down
      # actually fails on the v0.4.3-shaped defect (ref names one version,
      # plugin.json declares another), against a local fixture server. Runs
      # unconditionally so a regression in the checker itself is caught even
      # on a push that never touches marketplace.json.
      - name: Federated pin checker has a passing regression test
        run: node scripts/test/check-federated-pins.test.mjs

      # Same reasoning as the step above, for the content checker: proves it
      # actually fails on a repointed tag, a stale baseline and a missing one,
      # against a fake git-database API. Unconditional, so a regression in the
      # checker is caught even on a push that touches neither the index nor the
      # baselines.
      - name: Federated content checker has a passing regression test
        run: node scripts/test/check-federated-content.test.mjs

      # A federated entry pins a tag so its skill can never drift from the CLI
      # it describes (OPAG-37) - but a pin only does that if the tagged
      # release actually carries the content the pin implies. lore-cli's
      # v0.4.3 tag bumped its own package.json but not
      # .claude-plugin/plugin.json, so opum-marketplace pinned a tag whose
      # plugin manifest still read the PREVIOUS version - `claude plugin
      # update` saw no version change and silently kept serving the old
      # skill. Nothing caught it; it was found by hand, twice (OMARK-2,
      # OMARK-6). scripts/check-federated-pins.mjs is a self-consistency
      # check, not a diff against the previous pin: a pinned ref's own
      # plugin.json must declare that same version.
      #
      # Gated on marketplace.json changing in this PR - the pinned tags don't
      # change on their own, so a PR that doesn't touch the index can't have
      # introduced a bad one, and skipping the network read keeps an
      # unrelated PR (a hooks fix, say) from failing on a transient GitHub
      # API problem in a repository it never touched.
      - name: Federated entry pins match their own plugin version
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${{ github.base_ref }}"
          if ! merge_base=$(git merge-base "$base" HEAD); then
            echo "::error::no merge base between $base and HEAD - cannot tell what this PR changed."
            exit 1
          fi
          changed=$(git diff --name-only "$merge_base" HEAD -- .claude-plugin/marketplace.json)
          if [ -z "$changed" ]; then
            echo "marketplace.json unchanged; skipping the federated pin check (no network read)."
            exit 0
          fi
          node scripts/check-federated-pins.mjs

      # The pin check above answers "does this tag resolve, and does its own
      # plugin.json declare the version the pin names". Both stay true when a
      # tag is deleted and recreated over DIFFERENT content, because the pin is
      # by tag name and a tag name is mutable - every consumer silently follows
      # the move. lore-cli and quest-cli both had v0.6.0 destroyed and recreated
      # on 2026-09-10/11 (OMARK-43); the skill content happened to be unchanged,
      # and nothing here could have told us if it had not been.
      #
      # So this resolves the chain (tag ref -> tag object -> commit -> root tree
      # -> skills subtree) and compares against the SHAs recorded in
      # scripts/federated-pin-baselines.json. A git tree SHA hashes the content
      # beneath it, so an equal SHA is proof of byte-identity, not evidence of it.
      #
      # NOT gated on marketplace.json changing, unlike the version check: the
      # whole failure mode is a tag moving while this repository stands still.
      # On a PR it runs when the index or the baselines changed; on the daily
      # schedule and on pushes to dev/main it always runs, which is what
      # actually catches a repoint.
      - name: Federated entries still resolve to the verified skill content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch --no-tags origin "${{ github.base_ref }}"
            if ! merge_base=$(git merge-base "$base" HEAD); then
              echo "::error::no merge base between $base and HEAD - cannot tell what this PR changed."
              exit 1
            fi
            changed=$(git diff --name-only "$merge_base" HEAD -- .claude-plugin/marketplace.json scripts/federated-pin-baselines.json)
            if [ -z "$changed" ]; then
              echo "index and baselines both unchanged in this PR; the scheduled run covers repoints."
              exit 0
            fi
          fi
          node scripts/check-federated-content.mjs

  # OPAG-79, fleet-wide. Two failure modes that both reach dev without any
  # commit here to blame for them:
  #
  #   - A duplicated task identity (the same id in both .quest/tasks/ and
  #     .quest/completed/) exits conflict/5 and makes EVERY tracker read in the
  #     repository fail. That reached opum-web's dev once, unnoticed, because
  #     nothing asserted it.
  #   - Managed skill/instruction drift exits 6. It drifts on its own whenever
  #     the CLI moves underneath the committed copy - OMARK-45 here was exactly
  #     that: quest 0.6.0 added GEMINI.md to the skill file's target list, so a
  #     file nobody had touched became stale.
  #
  # Shape follows opum-web's reference job, which authored and negative-tested
  # it. Adapted where this repository genuinely differs rather than copied
  # blind - see the node-version comment below.
  tracker:
    name: Tracker integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A literal version, not node-version-file: this repository owns no JS
      # project, so it has neither .nvmrc nor package.json to read one from.
      # 24 matches the toolchain the fleet develops against.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Derived from CLAUDE.md's own managed block, deliberately: not pinned
      # (which would drift from the declared contract the moment either moved)
      # and not floated to latest (which would let a CLI release fail this
      # repository with no change here). The file that declares the version is
      # the file the check honours, so the two cannot disagree. A missing line
      # fails loudly rather than defaulting to something plausible.
      - name: Resolve the Quest version CLAUDE.md declares
        id: quest
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*Quest CLI \([0-9][0-9.]*\).*/\1/p' CLAUDE.md | head -1)"
          if [ -z "$version" ]; then
            echo "::error file=CLAUDE.md::No 'Quest CLI <version>' line found in the managed block. Tracker integrity cannot be checked against an undeclared version."
            exit 1
          fi
          echo "Declared Quest version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm install -g "@opum-ai/quest@${{ steps.quest.outputs.version }}"

      # Two separate steps on purpose: a combined one would report "tracker
      # integrity failed" without saying which of the two very different
      # problems it hit.
      - name: Tracker reads cleanly
        run: quest task list --json

      - name: Managed instructions are current
        run: quest agents --check --require-installed --target claude
